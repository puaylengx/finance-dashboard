    # ── Error ─────────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        detail:
          type: string
          example: "Invalid credentials"

  # ── RESPONSES ───────────────────────────────────────────────────────────────
  responses:
    Unauthorized:
      description: Token หาย หมดอายุ หรือไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            missing:
              summary: ไม่ได้แนบ token
              value:
                detail: "Not authenticated"
            expired:
              summary: Token หมดอายุ
              value:
                detail: "Invalid or expired token: Signature has expired."

    InvalidCredentials:
      description: Username หรือ password ไม่ถูกต้อง
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Invalid credentials"

    AccessDenied:
      description: |
        ตรวจสอบ Entra token สำเร็จ แต่ไม่มีสิทธิ์เข้าถึง —
        ไม่มี position และไม่ได้อยู่ใน coordinator table
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "ไม่มีสิทธิ์เข้าถึง (โปรดติดต่องานการเงิน หน่วยงบประมาณ)"

    Forbidden:
      description: Token ถูกต้อง แต่ role ไม่มีสิทธิ์เข้าถึง endpoint นี้
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Requires FA role"

    NotFound:
      description: ไม่พบ resource ที่ระบุ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Coordinator not found"

    ValidationError:
      description: Request body หรือ query params ไม่ถูกต้อง
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: array
                items:
                  type: object
                  properties:
                    loc:
                      type: array
                      items:
                        type: string
                    msg:
                      type: string
                    type:
                      type: string

    RateLimited:
      description: ส่ง request มากเกินไป — กรุณารอและลองใหม่
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Rate limit exceeded: 10 per 1 minute"

    InternalError:
      description: Database query ล้มเหลว
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: "Internal server error"
